# NuruXplore web app — split into a React frontend (nginx) and a FastAPI API.
# Follows the Ecofy house pattern: both services share one external docker
# network per project; nginx-proxy-manager joins that network and reverse-proxies
# by container name. Loopback ports are for local debugging only (no public
# exposure from the app itself).
#
#   nuruxplore.ecofy.co.tz    -> nuruxplore-web:80   (React SPA + /api proxy)
#   nuruxploreapi.ecofy.co.tz -> nuruxplore-api:8000 (FastAPI directly)
services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nuruxplore-web
    container_name: nuruxplore-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8020:80"
    depends_on:
      - api
    networks:
      - nuruxplore-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nuruxplore-api
    container_name: nuruxplore-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "127.0.0.1:8010:8000"
    networks:
      - nuruxplore-network

networks:
  nuruxplore-network:
    external: true
    name: nuruxplore-network
